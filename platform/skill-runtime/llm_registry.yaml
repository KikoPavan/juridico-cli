# platform/skill-runtime/llm_registry.yaml
# Registro Canônico de Modelos de LLM — juridico-cli
# Stack oficial: Gemini via API + llama.cpp local em Docker
# Referência: docs/architecture/juridico_cli_arquitetura_consolidada_corrigida_v2.md

execution_classes:
  gemini_api:
    provider: gemini
    mode: api
    deployment: external_api
    description: "Gemini via API remota — backend oficial para tarefas jurídicas"
    models:
      - id: "gemini-3-flash-preview"
        context_window: 1000000
        supports_native_json: true
        use_for: [fast_extraction, large_context, high_reasoning, complex_analysis]

  lm_studio_local:
    provider: lm_studio
    mode: local
    deployment: host
    description: "LM Studio no host — execução local sem custo de API"
    models:
      - id: "qwen2.5-1.5b-instruct"
        context_window: 128000
        supports_native_json: false
        use_for: [pre_processing, chunking, metadata, routing]

profiles:
  high_reasoning:
    description: "Tarefas jurídicas complexas (contratos sociais, contestações, FIRAC)"
    execution_class: gemini_api
    model: "gemini-3-flash-preview"

  fast_extraction:
    description: "Extrações padronizadas e curtas (cabeçalhos, metadados)"
    execution_class: gemini_api
    model: "gemini-3-flash-preview"

  large_context:
    description: "Análise de documentos integrais (petições, lotes de autos)"
    execution_class: gemini_api
    model: "gemini-3-flash-preview"

  local_preprocessing:
    description: "Pré-processamento, chunking e roteamento sem custo de API"
    execution_class: lm_studio_local
    model: "qwen2.5-1.5b-instruct"

fallback_model: "gemini-3-flash-preview"
fallback_execution_class: gemini_api
