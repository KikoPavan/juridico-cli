runtime:
  agent_name: "firac-cli"
  provider: "google-genai"
  model: "gemini-2.5-flash"
  temperature: 0.0
  max_output_tokens: 8192
  response_mime_type: "application/json"

  budgets:
    facts: 12
    issues: 8
    rules: 10
    analysis: 12
    conclusion: 6
    gaps: 10
    law_pack: 12

paths:
  prompt_file: "agents/firac-cli/prompt.md"
  io_schema: "agents/firac-cli/io.schema.json"

  input_processo_json: "outputs/processo/01_collector/collector_out_processo_consolidated.json"
  input_evidence_json: "outputs/cad_obr/05_evidence/dataset_v1/evidence_out.json"
  input_law_pack_json: "outputs/legal/law_pack_v1.json"

  output_relatorio_firac_json: "outputs/relatorio_firac.json"
  output_relatorio_firac_md: "outputs/relatorio_firac.md"

  logs_dir: "outputs/logs/firac-cli"

front_matter:
  prompt_has_yaml_frontmatter: true
  strip_before_send_to_model: true

validation:
  enforce_json_output: true
  require_supports_for: ["evidence", "inference"]

routing:
  document_type: "relatorio_firac"
  modes: ["firac_core", "firac_plus"]

skills_map:
  core: "agents/firac-cli/skills/SKILL.core.md"
  acao_nulidade_garantia_hipotecaria: "agents/firac-cli/skills/SKILL.acao_nulidade_garantia_hipotecaria.md"

jobs:
  - name: "firac_core"
    mode: "firac_core"
    input_processo: "outputs/processo/01_collector/collector_out_processo_consolidated.json"
    input_juntada: "collector_out_juntada_procuracao_Juraci_para_Francisco.json"
    input_law_pack: "outputs/legal/law_pack_v1.json"
    output_json: "outputs/relatorio_firac.json"
    output_md: "outputs/relatorio_firac.md"

  - name: "firac_plus"
    mode: "firac_plus"
    input_processo: "outputs/processo/01_collector/collector_out_processo_consolidated.json"
    input_evidence: "outputs/cad_obr/05_evidence/dataset_v1/evidence_out.json"
    input_law_pack: "outputs/legal/law_pack_v1.json"
    output_json: "outputs/relatorio_firac.json"
    output_md: "outputs/relatorio_firac.md"
    non_gate_optional_input: true

# compatibilidade com o runner (chaves planas)
model: "gemini-2.5-flash"
temperature: 0.0
max_output_tokens: 8192
budget_facts: 12
budget_issues: 8
budget_rules: 10
budget_analysis: 12
budget_conclusion: 6
budget_gaps: 10
budget_law_pack: 12
