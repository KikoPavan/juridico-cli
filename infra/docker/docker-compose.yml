# infra/docker/docker-compose.yml
# Stack local canônica — juridico-cli
# Ambiente: Docker Desktop (Windows + WSL2)
# Serviços: Qdrant
#
# LLM local: LM Studio no host (fora do Docker)
# A escolha do modelo ficará fora do compose.
#
# Gemini continua remoto via API.

services:
  qdrant:
    image: qdrant/qdrant:v1.16.0
    container_name: juridico-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ../qdrant/config.yaml:/qdrant/config/production.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  qdrant_storage:
    name: juridico-qdrant-storage
